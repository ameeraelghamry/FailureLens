<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FailureLens - VS Code Cockpit Minimalist Mockup</title>
  <style>
    :root {
      --vscode-bg: #1e1e1e;
      --vscode-sidebar-bg: #252526;
      --vscode-card-bg: #1f1f1f;
      --vscode-hover-bg: #2a2d2e;
      --vscode-border: #3c3c3c;
      --vscode-fg: #cccccc;
      --vscode-fg-bright: #ffffff;
      --vscode-fg-muted: #858585;
      --vscode-blue: #3794ff;
      --vscode-blue-btn: #007acc;
      --vscode-green: #89d185;
      --vscode-green-bg: rgba(137, 209, 133, 0.12);
      --vscode-red: #f48771;
      --vscode-red-bg: rgba(244, 135, 113, 0.12);
      --vscode-yellow: #cca700;
      --vscode-yellow-bg: rgba(204, 167, 0, 0.12);
      --vscode-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --vscode-mono: "SF Mono", Monaco, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: var(--vscode-font);
      background: #111;
      color: var(--vscode-fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      min-height: 100vh;
    }

    /* Simulation Control Toolbar */
    .state-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      background: #202020;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid var(--vscode-border);
      flex-wrap: wrap;
      align-items: center;
    }
    .state-bar span { font-size: 11px; color: var(--vscode-fg-muted); font-weight: 600; text-transform: uppercase; }
    .state-btn {
      background: #2d2d2d;
      border: 1px solid var(--vscode-border);
      color: var(--vscode-fg);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .state-btn:hover { background: var(--vscode-hover-bg); color: #fff; }
    .state-btn.active {
      background: var(--vscode-blue-btn);
      border-color: var(--vscode-blue-btn);
      color: #fff;
    }

    /* VS Code Frame Simulation */
    .vscode-container {
      display: flex;
      width: 420px;
      height: 740px;
      background: var(--vscode-sidebar-bg);
      border: 1px solid var(--vscode-border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
    }

    /* Activity Bar */
    .activity-bar {
      width: 48px;
      background: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10px;
      border-right: 1px solid rgba(0,0,0,0.2);
    }
    .act-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--vscode-fg-muted);
      cursor: pointer;
      position: relative;
    }
    .act-icon.active { color: #fff; }
    .act-icon.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: #fff;
    }

    /* Sidebar Content Panel */
    .sidebar-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--vscode-sidebar-bg);
      overflow: hidden;
    }

    .cockpit-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Header Row */
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--vscode-border);
    }
    .project-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--vscode-fg-bright);
      cursor: pointer;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-btn {
      cursor: pointer;
      font-size: 12px;
      color: var(--vscode-fg-muted);
    }
    .icon-btn:hover { color: #fff; }

    /* Incident Banner */
    .incident-banner {
      background: var(--vscode-red-bg);
      border: 1px solid var(--vscode-red);
      border-radius: 4px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .incident-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: var(--vscode-red);
    }
    .incident-cause {
      font-size: 11px;
      color: var(--vscode-fg);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Risk Card */
    .risk-card {
      background: var(--vscode-card-bg);
      border: 1px solid var(--vscode-border);
      border-radius: 4px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .risk-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .decision-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 3px;
    }
    .chip-block { background: var(--vscode-red-bg); color: var(--vscode-red); border: 1px solid var(--vscode-red); }
    .chip-deploy { background: var(--vscode-green-bg); color: var(--vscode-green); border: 1px solid var(--vscode-green); }
    .diff-stats {
      font-size: 10.5px;
      color: var(--vscode-fg-muted);
      font-family: var(--vscode-mono);
    }
    .web-link {
      font-size: 10.5px;
      color: var(--vscode-blue);
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .web-link:hover { text-decoration: underline; }

    /* Section Titles */
    .section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--vscode-fg-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Hypotheses */
    .hypo-item {
      background: var(--vscode-card-bg);
      border: 1px solid var(--vscode-border);
      border-radius: 3px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .hypo-item.confirmed { border-left: 3px solid var(--vscode-red); }
    .hypo-item.untested { border-left: 3px solid var(--vscode-fg-muted); }
    .hypo-item.rejected { border-left: 3px solid var(--vscode-green); }
    .hypo-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .hypo-title {
      font-weight: 600;
      font-size: 11px;
      color: #fff;
    }
    .status-pill {
      font-size: 9.5px;
      padding: 1px 5px;
      border-radius: 2px;
      font-weight: 600;
    }
    .pill-confirmed { background: var(--vscode-red-bg); color: var(--vscode-red); }
    .pill-untested { background: rgba(128,128,128,0.2); color: var(--vscode-fg-muted); }
    .pill-rejected { background: var(--vscode-green-bg); color: var(--vscode-green); }
    .hypo-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
    }
    .code-anchor {
      font-family: var(--vscode-mono);
      font-size: 10.5px;
      color: var(--vscode-blue);
      cursor: pointer;
      text-decoration: underline;
    }

    .btn-xs {
      background: #333;
      color: #ccc;
      border: 1px solid var(--vscode-border);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      cursor: pointer;
    }
    .btn-xs:hover { background: #444; color: #fff; }
    .btn-docker {
      background: var(--vscode-blue-btn);
      color: #fff;
      border: none;
    }
    .btn-docker:hover { background: #0062a3; }

    /* Chips */
    .chip-container {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .tag-chip {
      background: var(--vscode-card-bg);
      border: 1px solid var(--vscode-border);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-family: var(--vscode-mono);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .tag-chip:hover { border-color: var(--vscode-blue); color: var(--vscode-blue); }

    /* Chat Mini */
    .chat-container {
      background: var(--vscode-card-bg);
      border: 1px solid var(--vscode-border);
      border-radius: 4px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .preset-chips {
      display: flex;
      gap: 4px;
    }
    .preset-chip {
      background: rgba(128,128,128,0.15);
      border: 1px solid var(--vscode-border);
      border-radius: 10px;
      padding: 2px 7px;
      font-size: 9.5px;
      cursor: pointer;
    }
    .preset-chip:hover { background: var(--vscode-blue-btn); color: #fff; }
    .chat-bubble {
      font-size: 11px;
      line-height: 1.35;
      padding: 6px;
      background: rgba(128,128,128,0.08);
      border-radius: 3px;
      border-left: 2px solid var(--vscode-blue);
    }
    .chat-input-row {
      display: flex;
      gap: 4px;
    }
    .chat-input {
      flex: 1;
      background: #2d2d2d;
      color: #fff;
      border: 1px solid var(--vscode-border);
      padding: 4px 6px;
      font-size: 10.5px;
      border-radius: 3px;
      outline: none;
    }

    /* Status Bar */
    .status-bar {
      height: 22px;
      background: #c72e2e;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <!-- Controls -->
  <div class="state-bar">
    <span>Cockpit State:</span>
    <button class="state-btn active" onclick="setMode('block')">Block (Risk 88%)</button>
    <button class="state-btn" onclick="setMode('deploy')">Deploy (Safe 12%)</button>
    <button class="state-btn" onclick="setMode('incident')">Active Incident</button>
  </div>

  <div class="vscode-container">
    <div class="activity-bar">
      <div class="act-icon">📁</div>
      <div class="act-icon">🌿</div>
      <div class="act-icon active" title="FailureLens">🛡️</div>
      <div class="act-icon">🧩</div>
    </div>

    <div class="sidebar-panel">
      <div class="cockpit-content" id="content">
        <!-- Injected via JavaScript -->
      </div>

      <div class="status-bar" id="sb">
        <span>🛑 ■ BLOCK (88%)</span>
        <span>🐳 Docker: Ready</span>
      </div>
    </div>
  </div>

  <script>
    let mode = 'block';

    function setMode(m) {
      mode = m;
      document.querySelectorAll('.state-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      render();
    }

    function render() {
      const box = document.getElementById('content');
      const sb = document.getElementById('sb');

      if (mode === 'incident') {
        sb.style.background = '#c72e2e';
        sb.innerHTML = '<span>🔥 INC-1042 (P1) Active</span><span>🐳 Docker: Ready</span>';
        box.innerHTML = `
          <div class="header-row">
            <div class="project-pill">📦 checkout-service ▾</div>
            <div class="header-actions">
              <span class="icon-btn" style="color:var(--vscode-green);">🐳 Ready</span>
              <span class="icon-btn">🔄</span>
              <span class="icon-btn" onclick="alert('Opening web dashboard...')">↗</span>
            </div>
          </div>

          <div class="incident-banner">
            <div class="incident-header">
              <span>🔥 INC-1042 (P1) Active</span>
              <span class="web-link" onclick="alert('Opening Incident War Room in Dashboard...')">War Room ↗</span>
            </div>
            <div class="incident-cause">
              <span>Top Cause (92%):</span>
              <span class="code-anchor" onclick="alert('Jumped to src/db/pool.py:45')">pool.py:45</span>
            </div>
            <div style="display:flex; gap:6px; margin-top:2px;">
              <button class="btn-xs btn-docker" onclick="alert('🐳 Spawning Docker replay container...')">▶ Replay in Docker</button>
            </div>
          </div>

          <div class="section-title">
            <span>Model B Root Causes</span>
            <span class="web-link" onclick="alert('Opening Full RCA on Web...')">Timeline ↗</span>
          </div>

          <div class="hypo-item confirmed">
            <div class="hypo-top">
              <span class="hypo-title">1. DB Pool Lock Deadlock</span>
              <span class="status-pill pill-confirmed">92%</span>
            </div>
            <div class="hypo-meta">
              <span class="code-anchor">pool.py:45 [c4f2a9]</span>
              <button class="btn-xs btn-docker" onclick="alert('Replaying...')">▶ Verify</button>
            </div>
          </div>

          <div class="hypo-item untested">
            <div class="hypo-top">
              <span class="hypo-title">2. Redis Client Async Leak</span>
              <span class="status-pill pill-untested">68%</span>
            </div>
            <div class="hypo-meta">
              <span class="code-anchor">requirements.txt:18</span>
              <button class="btn-xs">Jump</button>
            </div>
          </div>
        `;
        return;
      }

      if (mode === 'deploy') {
        sb.style.background = '#287a38';
        sb.innerHTML = '<span>● DEPLOY (Safe 12%)</span><span>🐳 Docker: Ready</span>';
        box.innerHTML = `
          <div class="header-row">
            <div class="project-pill">📦 checkout-service ▾</div>
            <div class="header-actions">
              <span class="icon-btn" style="color:var(--vscode-green);">🐳 Ready</span>
              <span class="icon-btn">🔄</span>
              <span class="icon-btn" onclick="alert('Opening web dashboard...')">↗</span>
            </div>
          </div>

          <div class="risk-card">
            <div class="risk-badge-row">
              <div class="decision-chip chip-deploy">
                <span>●</span> <span>12% DEPLOY</span>
              </div>
              <span class="diff-stats">+18 / -4 (2 files)</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="font-size: 10px; color: var(--vscode-fg-muted);">All validations passed in Docker</span>
              <span class="web-link" onclick="alert('Opening web release report...')">Full Report ↗</span>
            </div>
          </div>

          <div class="section-title">
            <span>Hypotheses (3)</span>
            <span class="web-link">All ↗</span>
          </div>

          <div class="hypo-item rejected">
            <div class="hypo-top">
              <span class="hypo-title">H1: DB Connection Pool</span>
              <span class="status-pill pill-rejected">Safe</span>
            </div>
            <div class="hypo-meta">
              <span class="code-anchor">pool.py</span>
              <span style="font-size:10px; color:var(--vscode-green);">✓ Passed in Docker</span>
            </div>
          </div>
        `;
        return;
      }

      // Default: Block mode
      sb.style.background = '#c72e2e';
      sb.innerHTML = '<span>■ BLOCK (88%)</span><span>🐳 Docker: Ready</span>';
      box.innerHTML = `
        <div class="header-row">
          <div class="project-pill" onclick="alert('Select project...')">📦 checkout-service ▾</div>
          <div class="header-actions">
            <span class="icon-btn" style="color:var(--vscode-green);">🐳 Ready</span>
            <span class="icon-btn" onclick="alert('Re-analyzing diff...')">🔄</span>
            <span class="icon-btn" onclick="alert('Opening FailureLens Web Platform...')">↗</span>
          </div>
        </div>

        <div class="risk-card">
          <div class="risk-badge-row">
            <div class="decision-chip chip-block">
              <span>■</span> <span>88% BLOCK</span>
            </div>
            <span class="diff-stats">+142 / -31 (4 files)</span>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 10px; color: var(--vscode-fg-muted);">Validated in local Docker</span>
            <span class="web-link" onclick="alert('Opening web report...')">Full Report ↗</span>
          </div>
        </div>

        <div class="section-title">
          <span>Hypotheses (3)</span>
          <span class="web-link" onclick="alert('Opening hypotheses on web...')">All ↗</span>
        </div>

        <div class="hypo-item confirmed">
          <div class="hypo-top">
            <span class="hypo-title">H1: Pool Lock Exhaustion</span>
            <span class="status-pill pill-confirmed">CONFIRMED</span>
          </div>
          <div class="hypo-meta">
            <span class="code-anchor" onclick="alert('Jumped to src/db/pool.py:45')">pool.py:45</span>
            <div style="display:flex; gap:4px;">
              <button class="btn-xs btn-docker" onclick="alert('🐳 Running test in Docker...')">▶ Docker</button>
              <button class="btn-xs">✓</button>
              <button class="btn-xs">✕</button>
            </div>
          </div>
        </div>

        <div class="hypo-item untested">
          <div class="hypo-top">
            <span class="hypo-title">H2: Cache Invalidation Storm</span>
            <span class="status-pill pill-untested">UNTESTED</span>
          </div>
          <div class="hypo-meta">
            <span class="code-anchor">checkout.py:120</span>
            <div style="display:flex; gap:4px;">
              <button class="btn-xs btn-docker" onclick="alert('🐳 Validating H2 in Docker...')">▶ Docker</button>
              <button class="btn-xs">✓</button>
              <button class="btn-xs">✕</button>
            </div>
          </div>
        </div>

        <div class="hypo-item rejected">
          <div class="hypo-top">
            <span class="hypo-title">H3: Schema Contract Break</span>
            <span class="status-pill pill-rejected">REJECTED</span>
          </div>
          <div class="hypo-meta">
            <span class="code-anchor">order.ts</span>
            <span style="font-size:10px; color:var(--vscode-green);">✓ Passed in Docker</span>
          </div>
        </div>

        <div class="section-title">
          <span>Blast Radius (4)</span>
          <span style="color: var(--vscode-yellow);">⚡ Canary 5%</span>
        </div>
        <div class="chip-container">
          <div class="tag-chip" onclick="alert('Jumped to pool.py:45')"><span>📄 pool.py:45</span><span style="color:var(--vscode-red); font-size:9px;">[DIRECT]</span></div>
          <div class="tag-chip" onclick="alert('Jumped to checkout.py:120')"><span>📄 checkout.py:120</span><span style="color:var(--vscode-yellow); font-size:9px;">[DIRECT]</span></div>
          <div class="tag-chip"><span>🔗 order.ts</span><span style="color:var(--vscode-blue); font-size:9px;">[BLAST]</span></div>
        </div>

        <div class="section-title">
          <span>Ask FailureLens</span>
          <span class="web-link" onclick="alert('Opening Knowledge Hub...')">Knowledge Hub ↗</span>
        </div>
        <div class="chat-container">
          <div class="preset-chips">
            <div class="preset-chip" onclick="alert('Why Blocked: Saturated connection pool timeout')">Why Blocked?</div>
            <div class="preset-chip" onclick="alert('INC-842 (94% match) from Nov 2025')">Past Incidents</div>
          </div>
          <div class="chat-bubble">
            💡 Model A identified a connection leak in <code>pool.py:45</code> under 50 RPS.
            <div style="margin-top: 3px;">
              <span class="web-link" onclick="alert('Opening INC-842 on Web Platform...')">↗ Past Match: INC-842 (94%)</span>
            </div>
          </div>
          <div class="chat-input-row">
            <input type="text" class="chat-input" placeholder="Ask about this change..." />
            <button class="btn-xs btn-docker" onclick="alert('Querying FailureLens Assistant...')">Ask</button>
          </div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
